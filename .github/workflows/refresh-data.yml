name: Refresh forecast data

# Three times a day, offset from the main model cycles. Regenerates the baked
# data files and publishes the site, so a static host serves current data with
# no backend and no runtime API calls.
on:
  schedule:
    - cron: '20 2,10,18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pull forecast and water data
        run: node ingest/ingest.mjs

      # The grid must be complete. A short file means a batch failed, and a
      # partial grid misaligns every index the app reads.
      - name: Sanity check
        run: |
          test -s js/wx-grid.js
          SIZE=$(wc -c < js/wx-grid.js)
          echo "wx-grid.js is $SIZE bytes"
          test "$SIZE" -gt 500000 || { echo "grid looks truncated"; exit 1; }
          grep -q 'npts:987' js/wx-grid.js || echo "WARNING: point count changed"

      - name: Commit refreshed data
        run: |
          git config user.name  'omniguide-bot'
          git config user.email 'omniguide-bot@users.noreply.github.com'
          git add js/wx-grid.js js/gauges.js
          git diff --staged --quiet || git commit -m "data: refresh forecast $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
